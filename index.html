 return Object.entries(s.entries).every(([key,e])=>record(e)&&allowed.has(key)&&e.exerciseId===allowed.get(key)&&typeof e.done==='boolean'&&['load','sets','reps','rpe','notes'].every(k=>typeof e[k]==='string'));
}
function valid(s){return record(s)&&s.version===1&&validSession(s.current)&&Array.isArray(s.history)&&s.history.every(validSession);}
let lastSaved=null;
try{lastSaved=localStorage.getItem(KEY);if(lastSaved){const parsed=JSON.parse(lastSaved);if(!valid(parsed))throw Error('Invalid data');state=parsed;}}catch(e){storageError='Saved data could not be loaded. Existing storage will not be overwritten. Export this session before leaving, or restore a valid backup from History.';}
function storageStatus(message=''){
 $('#save-status').textContent=message?'Not saved · export backup':'Saved on this device';
 $('#save-status').classList.toggle('failed',!!message);
 $('#storage-warning').hidden=!message;
 $('#storage-warning').textContent=message;
}
function persist(){
 if(storageError){storageStatus(storageError);return false;}
 try{
  if(localStorage.getItem(KEY)!==lastSaved){storageError='FORGE data changed in another window. Export this window’s entries, then reload to load the latest saved data.';storageStatus(storageError);return false;}
  const raw=JSON.stringify(state);localStorage.setItem(KEY,raw);lastSaved=raw;storageStatus();return true;
 }catch(e){storageStatus('Storage unavailable or full. These changes are only in memory. Export a backup from History before closing.');return false;}
}
window.addEventListener('storage',ev=>{if(ev.key===KEY||ev.key===null){storageError='FORGE data changed in another window. Export this window’s entries, then reload to load the latest saved data.';storageStatus(storageError);}});
function toast(msg){$('#toast').textContent=msg;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').textContent='',3500);}
function confirmAction(title,text,action){$('#confirm-title').textContent=title;$('#confirm-text').textContent=text;pending=action;$('#confirm').showModal();}
$('#cancel').onclick=()=>{$('#confirm').close();pending=null;};$('#confirm-ok').onclick=()=>{const fn=pending;pending=null;$('#confirm').close();if(fn)fn();};$('#confirm').addEventListener('cancel',()=>pending=null);
function fieldsEmpty(){return {load:'',sets:'',reps:'',rpe:'',notes:'',done:false};}
function entry(key,id){if(!state.current.entries[key])state.current.entries[key]={...fieldsEmpty(),exerciseId:id};return state.current.entries[key];}
function meaningful(e){return e.done||['load','sets','reps','rpe','notes'].some(k=>e[k]);}
function stamp(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function summary(e){return [e.load&&'Load '+e.load,e.sets&&e.sets+' sets',e.reps,e.rpe&&'RPE '+e.rpe].filter(Boolean).join(' · ')||'No performance fields recorded';}
function previous(id){for(const s of [...state.history].reverse()){const entries=Object.values(s.entries).filter(e=>e.exerciseId===id&&meaningful(e));if(entries.length)return {s,e:entries[entries.length-1]};}return null;}
function itemsForDay(day){return PROGRAM.days[day].sections.flatMap((s,si)=>s.items.map((item,i)=>({...PROGRAM.exercises[item.id],...item,key:`d${day}s${si}i${i}`})));}
function progress(){const items=itemsForDay(state.current.day);return {total:items.length,done:items.filter(i=>state.current.entries[i.key]?.done).length};}
function progressUpdate(){const {done,total}=progress();if($('#progress-count'))$('#progress-count').textContent=total?`${done} / ${total} exercises checked`:'No exercises required';if($('#progress-fill'))$('#progress-fill').style.width=`${total?done/total*100:0}%`;}
function card(item,key){const e=state.current.entries[key]||fieldsEmpty(),p=previous(item.id);return `<article class="exercise ${e.done?'done':''}" data-card="${esc(key)}"><div class="card-top"><input class="check" type="checkbox" data-key="${esc(key)}" data-id="${item.id}" data-field="done" aria-label="Complete ${esc(item.name)}" ${e.done?'checked':''}><div><h3>${esc(item.name)}</h3><div class="prescription">${esc(item.sets)} × ${esc(item.reps)}</div></div></div><p class="cue">${esc(item.cue)}</p><div class="fields">${[['load','Weight / load','e.g. 24 kg, 50 lb, band'],['sets','Sets completed',item.sets],['reps','Reps / time',item.reps],['rpe','RPE · 1–10','e.g. 7']].map(([f,label,placeholder])=>`<label>${label}<input data-key="${esc(key)}" data-id="${item.id}" data-field="${f}" ${f==='rpe'?'type="text" inputmode="decimal"':f==='sets'?'type="text" inputmode="numeric"':'type="text"'} placeholder="${esc(placeholder)}" value="${esc(e[f])}" aria-label="${label} for ${esc(item.name)}"></label>`).join('')}<label class="wide">Notes<textarea data-key="${esc(key)}" data-id="${item.id}" data-field="notes" placeholder="Variation, set-by-set reps, how it felt…" aria-label="Notes for ${esc(item.name)}">${esc(e.notes)}</textarea></label></div><p class="previous">${p?`<strong>Previous · ${stamp(p.s.started)}</strong><br>${esc(summary(p.e))}${p.e.notes?'<br>'+esc(p.e.notes):''}`:'No previous entry yet.'}</p></article>`;}
const icons={today:'<path d="M4 5h16v16H4zM8 2v6M16 2v6M4 10h16m-12 5 3 3 5-5"/>',rotation:'<path d="M20 10a8 8 0 0 0-14-4L3 9m0-6v6h6m-5 5a8 8 0 0 0 14 4l3-3m0 6v-6h-6"/>',mobility:'<circle cx="12" cy="4" r="2"/><path d="m4 9 8 2 8-2m-8 2v5m0 0-6 6m6-6 6 6"/>',history:'<path d="M4 5h16v16H4zM8 9h8M8 13h8M8 17h5M8 2v5M16 2v5"/>'};
function nav(){ $('.nav').innerHTML=Object.entries(icons).map(([id,path])=>`<button data-view="${id}" ${view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>${id[0].toUpperCase()+id.slice(1)}</button>`).join('');}
function today(){const s=state.current,d=PROGRAM.days[s.day];return `<section class="hero"><div class="eyebrow">Cycle ${String(s.cycle).padStart(2,'0')} <span aria-hidden="true">/</span> Day ${String(s.day+1).padStart(2,'0')} of 10</div><h1>${d.name}</h1><div class="eyebrow">${d.tag}</div><p>${d.desc}</p><div class="chips"><span class="chip">${d.time}</span><span class="chip">Advance at your pace</span></div><div class="progress"><span id="progress-fill"></span></div><div class="progress-label"><span id="progress-count"></span><span>Opened ${stamp(s.started)}</span></div></section><div class="toolbar"><button class="primary" data-action="next">Next Rotation Day <span aria-hidden="true">→</span></button><button data-action="reset">Reset Checks</button></div><p class="hint">Entries save as you type. Advancing archives this session, including unfinished entries.</p>${d.sections.map((sec,si)=>`<h2 class="section-title">${sec.title}</h2><div class="cards">${sec.items.map((item,i)=>card({...PROGRAM.exercises[item.id],...item},`d${s.day}s${si}i${i}`)).join('')}</div>`).join('')}${!d.sections.length?'<div class="empty"><div class="rest-symbol">☾</div><h2>Make room to recover.</h2><p>No checkboxes to chase today.</p></div>':''}<div class="session-note"><label for="session-note">Session notes · energy, recovery, anything worth remembering</label><textarea id="session-note" placeholder="How are you feeling?">${esc(s.note)}</textarea></div><details><summary>Protocol notes</summary><div class="install-body">Follow the sequence, not the calendar. Add recovery time whenever you need it. Mobility between strength sets stays gentle. Record actual work in the blank fields; icy blue text is the suggested prescription. RPE is effort from 1 to 10. Use notes for individual set reps and rowing variations. New mobility additions use editable starting suggestions.</div></details>${install()}`;}
function rotation(){if(preview!==null){const d=PROGRAM.days[preview];return `<button data-action="back">← All rotation days</button><h1 class="page-title">${String(preview+1).padStart(2,'0')} / ${d.name}</h1><p class="intro">${d.desc}</p><p class="hint">Program preview. Log the active session in Today; previewing does not advance your rotation.</p>${d.sections.map(s=>`<section class="panel"><h2 class="section-title">${s.title}</h2>${s.items.map(i=>{const e={...PROGRAM.exercises[i.id],...i};return `<div class="preview-item"><strong>${esc(e.name)}</strong><br><span>${e.sets} × ${e.reps}</span><p class="hint">${esc(e.cue)}</p></div>`;}).join('')}</section>`).join('')||'<div class="empty">Full rest. Nothing required.</div>'}`;}
return `<div class="eyebrow">THE LONG GAME</div><h1 class="page-title">Your rotation.</h1><p class="intro">Ten sessions. No Monday reset. Stay on a day as long as you need, then advance when ready.</p><div class="rotation-list">${PROGRAM.days.map((d,i)=>`<button class="day-row ${i===state.current.day?'active':''}" data-preview="${i}"><span class="day-num">${String(i+1).padStart(2,'0')}</span><span><strong>${d.name}${i===state.current.day?' · Current':''}</strong><small>${d.tag} · ${d.time}</small></span><span class="arrow" aria-hidden="true">↗</span></button>`).join('')}</div><p class="hint">Tap a day to preview its plan. The current session changes only with Next Rotation Day.</p>`;}
function mobilityCards(){const list=Object.values(PROGRAM.exercises).filter(e=>e.group==='Mobility'&&(`${e.name} ${e.cue}`.toLowerCase().includes(search.toLowerCase()))&&(category==='All'||(category==='Hips & legs'?['squat','cossack','airplane','lunge','9090','flexor','adductor','windmill'].includes(e.id):!['squat','cossack','airplane','lunge','9090','flexor','adductor','windmill'].includes(e.id))));return list.length?list.map(e=>card(e,'mob-'+e.id)).join(''):'<p class="empty">No matching movements. Try another search.</p>';}
function mobility(){return `<div class="eyebrow">MOVE / ACTIVATE / RESTORE</div><h1 class="page-title">Range is strength.</h1><p class="intro">Choose a few movements, take your time. Library entries are extra mobility logged to your current Day ${state.current.day+1} session, separately from its prescribed exercises.</p><div class="search-row"><input id="search" type="search" placeholder="Search mobility…" aria-label="Search mobility" value="${esc(search)}"><select id="category" aria-label="Mobility region">${['All','Hips & legs','Shoulders & spine'].map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select></div><div id="mobility-cards" class="cards">${mobilityCards()}</div>`;}
function historySession(s,current=false){const entries=Object.values(s.entries).filter(meaningful);return `<details><summary>${current?'In progress · ':''}${PROGRAM.days[s.day].name}<small>${stamp(s.started)} · Cycle ${s.cycle} / Day ${s.day+1} · ${entries.filter(e=>e.done).length} checked${current?'':' · Archived '+stamp(s.ended||s.started)}</small></summary><div class="history-content">${entries.map(e=>`<div class="history-item"><strong>${e.done?'✓ ':'○ '}${esc(PROGRAM.exercises[e.exerciseId].name)}</strong><p>${esc(summary(e))}</p>${e.notes?`<p>${esc(e.notes)}</p>`:''}</div>`).join('')||'<p class="hint">No exercise entries recorded.</p>'}${s.note?`<div class="history-item"><strong>Session notes</strong><p>${esc(s.note)}</p></div>`:''}</div></details>`;}
function history(){return `<div class="eyebrow">THE RECORD</div><h1 class="page-title">Work, remembered.</h1><p class="intro">${state.history.length} archived sessions. Your current session is saved continuously; Next Rotation Day adds it to this record.</p><div class="toolbar"><button data-action="export">Export backup</button><button data-action="import">Import backup</button></div><p class="hint">Data stays in this browser on this device. Export a backup before changing devices, browsers or site addresses.</p><h2 class="section-title">Current session</h2>${historySession(state.current,true)}<h2 class="section-title">Archived sessions</h2>${[...state.history].reverse().map(s=>historySession(s)).join('')||'<div class="empty">Your story starts here.<br>Advance a rotation day to archive your first session.</div>'}${install()}`;}
function install(){return `<details><summary>Use FORGE on your iPhone</summary><div class="install-body">Open your hosted FORGE URL in Safari. Tap Share, then Add to Home Screen (enable Open as Web App if offered). Open FORGE from that icon and keep using the same address. Wait for the offline-ready message below before going offline. Export a backup in Safari before installing: the home-screen app may have separate storage. Import that backup from History inside the installed app. Logs stay on this device; keep regular backups. HTML attachment previews may not run the app.<p class="offline-status" role="status"></p></div></details>`;}
function render(){nav();$('#app').innerHTML=({today,rotation,mobility,history}[view])();progressUpdate();offlineStatus(offlineMessage);}
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='search'){search=el.value;$('#mobility-cards').innerHTML=mobilityCards();return;}if(el.id==='session-note'){state.current.note=el.value;persist();return;}if(!el.dataset.field)return;// Save raw input even outside the suggested range so typed logs are never silently lost.
const e=entry(el.dataset.key,el.dataset.id);e[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;persist();if(el.type==='checkbox'){el.closest('.exercise').classList.toggle('done',el.checked);progressUpdate();}});
document.addEventListener('change',ev=>{if(ev.target.id==='category'){category=ev.target.value;$('#mobility-cards').innerHTML=mobilityCards();}});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;preview=null;render();window.scrollTo(0,0);return;}if(b.dataset.preview!==undefined){preview=Number(b.dataset.preview);render();window.scrollTo(0,0);return;}switch(b.dataset.action){case 'back':preview=null;render();window.scrollTo(0,0);break;case 'reset':confirmAction('Reset checks?','Clear completion checks for this session, including extra mobility. All loads, reps and notes stay saved.',()=>{Object.values(state.current.entries).forEach(e=>e.done=false);const saved=persist();render();toast(saved?'Checks reset. Your entries are intact.':'Checks reset in memory. Export a backup.');});break;case 'next':{const s=state.current;confirmAction('Advance the protocol?',`Archive Day ${s.day+1}: ${PROGRAM.days[s.day].name} and start ${s.day===9?'a new cycle':'Day '+(s.day+2)}. Unchecked work is preserved as unfinished.`,()=>{state.history.push({...state.current,ended:new Date().toISOString()});state.current=fresh((s.day+1)%10,s.cycle+(s.day===9?1:0));const saved=persist();render();window.scrollTo(0,0);toast(saved?'Session archived. Next day ready.':'Advanced in memory only. Export a backup.');});break;}case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forge-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup download requested. Save the JSON file.');break;}case 'import':$('#import-file').click();break;}});
$('#import-file').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const imported=JSON.parse(await f.text());if(!valid(imported))throw Error();confirmAction('Replace with backup?',`Restore ${imported.history.length} archived sessions and its active day. This replaces current FORGE data. Export first if you want to keep it.`,()=>{state=imported;storageError='';try{lastSaved=localStorage.getItem(KEY);}catch{}const saved=persist();render();toast(saved?'Backup restored.':'Backup loaded in memory only. Storage unavailable.');});}catch{toast('Invalid backup. Current data was not changed.');}});
// Updates wait until all FORGE windows close; never reload an active workout.
let offlineMessage='Offline support requires HTTPS (or localhost).';
function offlineStatus(message){offlineMessage=message;document.querySelectorAll('.offline-status').forEach(el=>el.textContent=message);}
if('serviceWorker' in navigator&&window.isSecureContext&&location.protocol!=='file:'){
 offlineMessage='Preparing offline access…';
 navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(reg=>{
  navigator.serviceWorker.ready.then(()=>offlineStatus(reg.waiting?'Update ready. Close all FORGE windows and reopen to apply.':'Ready for offline use. Keep backups of your logs.'));
  const check=()=>{if(reg.waiting)offlineStatus('Update ready. Close all FORGE windows and reopen to apply.');};
  check();reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',check);});
 }).catch(()=>offlineStatus('Offline setup failed. Reopen online to retry; keep a backup of your logs.'));
}
render();persist();
</script></body></html>
