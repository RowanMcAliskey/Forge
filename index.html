function dynamicPlan(id){const b=BASELINES[id];if(!b)return null;const last=previous(id),p=last&&last.e,prior=numericLoad(p&&p.load),reps=performanceNumbers(p&&p.reps),sets=Number(p&&p.sets),rpe=Number(p&&p.rpe);let load=b.load,reason='Starting load';if(prior!==null){load=prior;reason='Repeat the last load';if(p.done&&sets>=b.sets&&reps.length&&Math.min(...reps)>=b.max&&rpe>0&&rpe<=b.rpe){load=prior+b.increment;reason='Add one small increment: last work met the top reps at a controlled RPE';}else if(!p.done||rpe>=9||!reps.length||Math.min(...reps)<b.min){load=Math.max(b.increment,prior-b.increment);reason='Reduce one increment: last work was incomplete, below reps, or too hard';}}return {...b,load,reason,suggested:load===null?(b.load===null?'Bodyweight inverted row':String(b.load)):formatLoad(load,b)};}

function movementCard(item,key){const plan=dynamicPlan(item.id);if(!plan)return card(item,key);const waveOn=experiment(item.id).enabled&&['goblet','ohp','bench'].includes(item.id);const guided={...item,sets:waveOn?String(item.sets):String(plan.sets),reps:waveOn?item.reps:`${plan.min}–${plan.max}`};return `<div class="dynamic-movement"><div class="load-plan"><div><span class="eyebrow">Suggested working load</span><strong>${esc(plan.suggested)}</strong><small>${esc(plan.reason)}</small></div><button data-action="use-weight" data-id="${item.id}" data-key="${esc(key)}">Use this load</button><p><b>${waveOn?guided.sets:plan.sets} working set${(waveOn?Number(guided.sets):plan.sets)===1?'':'s'} · ${esc(waveOn?guided.reps:`${plan.min}–${plan.max}`)} ${item.id==='waiter'||item.id==='suitcase'?'yd / side':'reps'}</b>${plan.warmup?`<br>Warm-up: 1 × 5 at about ${esc(formatLoad(plan.warmup,plan))}`:''}<br>${esc(plan.note)}</p></div>${card(guided,key)}</div>`;}

function guidePosition(d){const g=state.current.guide||{block:0,round:0,step:0};g.block=Math.max(0,Math.min(g.block,d.guided.length-1));const b=d.guided[g.block];g.round=Math.max(0,Math.min(g.round,guideRounds(b)-1));g.step=Math.max(0,Math.min(g.step,b.steps.length-1));state.current.guide=g;return g;}
function guideRounds(b){return b.progression&&experiment(b.progression).enabled?WAVE[experiment(b.progression).stage].sets:b.rounds;}
function guidedToday(d){const g=guidePosition(d),b=d.guided[g.block],rounds=guideRounds(b),raw=b.steps[g.step],item=waveItem({...PROGRAM.exercises[raw.id],...raw});const ordinal=d.guided.slice(0,g.block).reduce((n,x)=>n+guideRounds(x)*x.steps.length,0)+g.round*b.steps.length+g.step+1,total=d.guided.reduce((n,x)=>n+guideRounds(x)*x.steps.length,0);return `<section class="guide"><div class="guide-head"><div><div class="section-title">Guided movement · ${ordinal} of ${total}</div><h2>${esc(b.title)}</h2><p>Round ${g.round+1} of ${rounds} · <strong>${esc(raw.role)}</strong></p></div><span class="role role-${raw.role.toLowerCase()}">${esc(raw.role)}</span></div>${['RESET','RESTORE'].includes(raw.role)?'<p class="nonfatigue"><strong>Low effort:</strong> practice position and control. Do not create fatigue.</p>':''}${b.progression&&raw.id===b.progression?experimentPanel(item):''}${movementCard(item,item.key)}<div class="guide-controls"><button data-action="guide-prev" ${g.block===0&&g.round===0&&g.step===0?'disabled':''}>← Previous movement</button><button class="primary" data-action="guide-next">${ordinal===total?'Finish guided session':'Complete step & continue →'}</button></div><details class="block-map"><summary>View the full guided sequence</summary><div class="install-body">${d.guided.map((block,bi)=>`<div class="map-block ${bi===g.block?'active':''}"><strong>${esc(block.title)} · ${guideRounds(block)} round${guideRounds(block)===1?'':'s'}</strong><span>${block.steps.map(x=>`${x.role}: ${PROGRAM.exercises[x.id].name}`).join(' → ')}</span></div>`).join('')}</div></details></section>`;}
function workoutEntry(item,key){const e=state.current.entries[key]||fieldsEmpty(),p=dynamicPlan(item.id),dynamic=!!p,waveOn=experiment(item.id).enabled&&['goblet','ohp','bench'].includes(item.id),shown={...item,sets:waveOn?String(item.sets):dynamic?String(p.sets):item.sets,reps:waveOn?item.reps:dynamic?`${p.min}–${p.max}`:item.reps};const detailed=['LIFT','CARRY','OUTPUT'].includes(item.role);return `<article class="workout-card ${e.done?'done':''}" data-card="${esc(key)}">${dynamic?`<div class="load-plan"><div><span class="eyebrow">Suggested working load</span><strong>${esc(p.suggested)}</strong><small>${esc(p.reason)}</small></div><button data-action="use-weight" data-id="${item.id}" data-key="${esc(key)}">Use this load</button><p><b>${shown.sets} working set${Number(shown.sets)===1?'':'s'} · ${esc(shown.reps)}</b>${p.warmup?`<br>Warm-up: 1 × 5 at about ${esc(formatLoad(p.warmup,p))}`:''}<br>${esc(p.note)}</p></div>`:''}<div class="card-top"><input class="check" type="checkbox" data-key="${esc(key)}" data-id="${item.id}" data-field="done" aria-label="Complete ${esc(item.name)}" ${e.done?'checked':''}><div><h3 class="exercise-title">${esc(item.name)}</h3><div class="prescription">${esc(shown.sets)} × ${esc(shown.reps)}</div></div></div>${['PRIME','RESET','RESTORE'].includes(item.role)?'<p class="nonfatigue"><strong>Low effort:</strong> practice position and control. Do not create fatigue.</p>':''}<p class="cue">${esc(item.cue)}</p>${detailed?'':`<button class="primary" data-action="complete-current">Complete this movement</button>`}<details><summary>More logging</summary><div class="fields">${[['load','Weight / load','e.g. 50 lb'],['sets','Sets completed',shown.sets],['reps','Reps / time',shown.reps],['rpe','RPE · 1–10','e.g. 7']].map(([f,label,placeholder])=>`<label>${label}<input data-key="${esc(key)}" data-id="${item.id}" data-field="${f}" ${f==='rpe'?'type="number" min="1" max="10" step="0.5" inputmode="decimal"':f==='sets'?'type="number" min="0" step="1" inputmode="numeric"':'type="text"'} placeholder="${esc(placeholder)}" value="${esc(e[f])}" aria-label="${label} for ${esc(item.name)}"></label>`).join('')}<label class="wide">Notes<textarea data-key="${esc(key)}" data-id="${item.id}" data-field="notes" placeholder="Variation, set-by-set reps, how it felt…" aria-label="Notes for ${esc(item.name)}">${esc(e.notes)}</textarea></label></div><p class="previous">${p?`<strong>Previous · ${stamp(p.s.started)}</strong><br>${esc(summary(p.e))}${p.e.notes?'<br>'+esc(p.e.notes):''}`:'No previous entry yet.'}</p></details></article>`;}
function workoutMode(d){const g=guidePosition(d),b=d.guided[g.block],raw=b.steps[g.step],item={...PROGRAM.exercises[raw.id],...raw},ordinal=d.guided.slice(0,g.block).reduce((n,x)=>n+guideRounds(x)*x.steps.length,0)+g.round*b.steps.length+g.step+1,total=d.guided.reduce((n,x)=>n+guideRounds(x)*x.steps.length,0);return `<div class="workout-shell"><div class="workout-top"><div><div class="wordmark">FORGE</div><small>${esc(d.name)} · ${esc(b.title)}</small></div><div><h1>${esc(item.name)}</h1><small>Round ${g.round+1} of ${guideRounds(b)} · Movement ${ordinal} of ${total}</small></div><button data-action="reset">Reset Checks</button><button data-action="exit-workout">Exit Workout</button></div><div class="workout-stage"><div class="workout-progress">Round ${g.round+1} of ${guideRounds(b)} · Movement ${ordinal} of ${total}</div>${b.progression&&raw.id===b.progression?experimentPanel(item):''}${workoutEntry(item,item.key)}<details class="block-map"><summary>View full guided sequence</summary><div class="install-body">${d.guided.map((block,bi)=>`<div class="map-block ${bi===g.block?'active':''}"><strong>${esc(block.title)} · ${guideRounds(block)} round${guideRounds(block)===1?'':'s'}</strong><span>${block.steps.map(x=>`${x.role}: ${PROGRAM.exercises[x.id].name}`).join(' → ')}</span></div>`).join('')}</div></details></div><div class="workout-bottom"><button data-action="guide-prev" ${g.block===0&&g.round===0&&g.step===0?'disabled':''}>← Previous Movement</button><button class="primary" data-action="guide-next">${ordinal===total?'Finish guided session':'Complete Step & Continue →'}</button></div></div>`;}
function moveGuide(direction){const d=PROGRAM.days[state.current.day],g=guidePosition(d),b=d.guided[g.block];if(direction>0){const raw=b.steps[g.step],e=entry(raw.key,raw.id);if(g.round===guideRounds(b)-1)e.done=true;if(g.step<b.steps.length-1)g.step++;else if(g.round<guideRounds(b)-1){g.step=0;g.round++;}else if(g.block<d.guided.length-1){g.block++;g.round=0;g.step=0;}else{toast('Guided session complete. Review your log, then advance when ready.');}}else if(g.step>0)g.step--;else if(g.round>0){g.round--;g.step=b.steps.length-1;}else if(g.block>0){g.block--;const prior=d.guided[g.block];g.round=guideRounds(prior)-1;g.step=prior.steps.length-1;}persist();render();}
const icons={today:'<path d="M4 5h16v16H4zM8 2v6M16 2v6M4 10h16m-12 5 3 3 5-5"/>',rotation:'<path d="M20 10a8 8 0 0 0-14-4L3 9m0-6v6h6m-5 5a8 8 0 0 0 14 4l3-3m0 6v-6h-6"/>',mobility:'<circle cx="12" cy="4" r="2"/><path d="m4 9 8 2 8-2m-8 2v5m0 0-6 6m6-6 6 6"/>',history:'<path d="M4 5h16v16H4zM8 9h8M8 13h8M8 17h5M8 2v5M16 2v5"/>'};
function nav(){ $('.nav').innerHTML=Object.entries(icons).map(([id,path])=>`<button data-view="${id}" ${view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>${id[0].toUpperCase()+id.slice(1)}</button>`).join('');}
function today(){const s=state.current,d=PROGRAM.days[s.day];return `<section class="hero"><div class="eyebrow">Cycle ${String(s.cycle).padStart(2,'0')} <span aria-hidden="true">/</span> Day ${String(s.day+1).padStart(2,'0')} of 10</div><h1>${d.name}</h1><div class="eyebrow">${d.tag}</div><p>${d.desc}</p><div class="chips"><span class="chip">${d.time}</span><span class="chip">Advance at your pace</span></div><div class="progress"><span id="progress-fill"></span></div><div class="progress-label"><span id="progress-count"></span><span>Opened ${stamp(s.started)}</span></div></section><div class="toolbar"><button class="primary" data-action="next">Next Rotation Day <span aria-hidden="true">→</span></button><button data-action="reset">Reset Checks</button></div><p class="hint">Entries save as you type. Advancing archives this session, including unfinished entries.</p>${d.guided?guidedToday(d):d.sections.map((sec,si)=>`<h2 class="section-title">${sec.title}</h2><div class="cards">${sec.items.map((item,i)=>card({...PROGRAM.exercises[item.id],...item},`d${s.day}s${si}i${i}`)).join('')}</div>`).join('')}${!d.guided&&!d.sections.length?'<div class="empty"><div class="rest-symbol">☾</div><h2>Make room to recover.</h2><p>No checkboxes to chase today.</p></div>':''}<div class="session-note"><label for="session-note">Session notes · energy, recovery, anything worth remembering</label><textarea id="session-note" placeholder="How are you feeling?">${esc(s.note)}</textarea></div><details><summary>Protocol notes</summary><div class="install-body">PRIME prepares the movement. RESET and RESTORE are low-effort mobility or control and should not create fatigue. LIFT is the primary strength movement. CARRY is loaded locomotion. OUTPUT is the finisher. Follow the sequence, not the calendar. Icy blue text is the suggested prescription; log the work actually completed.</div></details>${install()}`;}
function rotation(){if(preview!==null){const d=PROGRAM.days[preview],groups=d.guided||d.sections.map(s=>({title:s.title,steps:s.items,rounds:1}));return `<button data-action="back">← All rotation days</button><h1 class="page-title">${String(preview+1).padStart(2,'0')} / ${d.name}</h1><p class="intro">${d.desc}</p><p class="hint">Program preview. Log the active session in Today; previewing does not advance your rotation.</p>${groups.map(s=>`<section class="panel"><h2 class="section-title">${s.title}${d.guided?' · '+guideRounds(s)+' round'+(guideRounds(s)===1?'':'s'):''}</h2>${s.steps.map(i=>{const e=waveItem({...PROGRAM.exercises[i.id],...i});return `<div class="preview-item"><strong>${i.role?'<span class="role-inline">'+esc(i.role)+'</span> ':''}${esc(e.name)}</strong><br><span>${e.sets} × ${e.reps}</span><p class="hint">${esc(e.cue)}</p></div>`;}).join('')}</section>`).join('')||'<div class="empty">Full rest. Nothing required.</div>'}`;}
return `<div class="eyebrow">THE LONG GAME</div><h1 class="page-title">Your rotation.</h1><p class="intro">Ten sessions. No Monday reset. Stay on a day as long as you need, then advance when ready.</p><div class="rotation-list">${PROGRAM.days.map((d,i)=>`<button class="day-row ${i===state.current.day?'active':''}" data-preview="${i}"><span class="day-num">${String(i+1).padStart(2,'0')}</span><span><strong>${d.name}${i===state.current.day?' · Current':''}</strong><small>${d.tag} · ${d.time}</small></span><span class="arrow" aria-hidden="true">↗</span></button>`).join('')}</div><p class="hint">Tap a day to preview its plan. The current session changes only with Next Rotation Day.</p>`;}
function mobilityCards(){const list=Object.values(PROGRAM.exercises).filter(e=>e.group==='Mobility'&&(`${e.name} ${e.cue}`.toLowerCase().includes(search.toLowerCase()))&&(category==='All'||(category==='Hips & legs'?['squat','cossack','airplane','lunge','9090','flexor','adductor','windmill'].includes(e.id):!['squat','cossack','airplane','lunge','9090','flexor','adductor','windmill'].includes(e.id))));return list.length?list.map(e=>card(e,'mob-'+e.id)).join(''):'<p class="empty">No matching movements. Try another search.</p>';}
function mobility(){return `<div class="eyebrow">MOVE / ACTIVATE / RESTORE</div><h1 class="page-title">Range is strength.</h1><p class="intro">Choose a few movements, take your time. Library entries are extra mobility logged to your current Day ${state.current.day+1} session, separately from its prescribed exercises.</p><div class="search-row"><input id="search" type="search" placeholder="Search mobility…" aria-label="Search mobility" value="${esc(search)}"><select id="category" aria-label="Mobility region">${['All','Hips & legs','Shoulders & spine'].map(c=>`<option ${c===category?'selected':''}>${c}</option>`).join('')}</select></div><div id="mobility-cards" class="cards">${mobilityCards()}</div>`;}
function historySession(s,current=false){const entries=Object.values(s.entries).filter(meaningful);return `<details><summary>${current?'In progress · ':''}${PROGRAM.days[s.day].name}<small>${stamp(s.started)} · Cycle ${s.cycle} / Day ${s.day+1} · ${entries.filter(e=>e.done).length} checked${current?'':' · Archived '+stamp(s.ended||s.started)}</small></summary><div class="history-content">${entries.map(e=>`<div class="history-item"><strong>${e.done?'✓ ':'○ '}${esc(PROGRAM.exercises[e.exerciseId].name)}</strong><p>${esc(summary(e))}</p>${e.notes?`<p>${esc(e.notes)}</p>`:''}</div>`).join('')||'<p class="hint">No exercise entries recorded.</p>'}${s.note?`<div class="history-item"><strong>Session notes</strong><p>${esc(s.note)}</p></div>`:''}</div></details>`;}
function history(){return `<div class="eyebrow">THE RECORD</div><h1 class="page-title">Work, remembered.</h1><p class="intro">${state.history.length} archived sessions. Your current session is saved continuously; Next Rotation Day adds it to this record.</p><div class="toolbar"><button data-action="export">Export backup</button><button data-action="import">Import backup</button></div><p class="hint">Data stays in this browser on this device. Export a backup before changing devices, browsers or site addresses.</p><h2 class="section-title">Current session</h2>${historySession(state.current,true)}<h2 class="section-title">Archived sessions</h2>${[...state.history].reverse().map(s=>historySession(s)).join('')||'<div class="empty">Your story starts here.<br>Advance a rotation day to archive your first session.</div>'}${install()}`;}
function install(){return `<details><summary>Use FORGE on your iPhone</summary><div class="install-body">Open your hosted FORGE URL in Safari. Tap Share, then Add to Home Screen (enable Open as Web App if offered). Open FORGE from that icon and keep using the same address. This single-file edition has no offline page cache; an internet connection may be needed to reopen it. Logs remain in local storage. HTML attachment previews may not run the app.</div></details>`;}
function render(){const isWorkout=view==='today'&&!!PROGRAM.days[state.current.day].guided&&workoutActive;document.body.classList.toggle('workout-active',isWorkout);nav();$('#app').innerHTML=(storageError?`<p class="warning">${esc(storageError)}</p>`:'')+(isWorkout?workoutMode(PROGRAM.days[state.current.day]):({today,rotation,mobility,history}[view])());progressUpdate();}
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='search'){search=el.value;$('#mobility-cards').innerHTML=mobilityCards();return;}if(el.id==='session-note'){state.current.note=el.value;persist();return;}if(!el.dataset.field)return;if(!el.checkValidity()){el.reportValidity();return;}const e=entry(el.dataset.key,el.dataset.id);e[el.dataset.field]=el.type==='checkbox'?el.checked:el.value;persist();if(el.type==='checkbox'){el.closest('.exercise').classList.toggle('done',el.checked);progressUpdate();}const waveButton=document.querySelector('[data-action="wave-next"]');if(waveButton)waveButton.disabled=!qualifies(waveButton.dataset.id,waveButton.dataset.key);});
document.addEventListener('change',ev=>{if(ev.target.id==='category'){category=ev.target.value;$('#mobility-cards').innerHTML=mobilityCards();}if(ev.target.dataset.experiment){const x=experiment(ev.target.dataset.experiment);x.enabled=ev.target.checked;x.stage=x.stage||0;persist();render();toast(x.enabled?'Progression experiment enabled.':'Progression experiment paused.');}});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;preview=null;workoutActive=view==='today'&&!!PROGRAM.days[state.current.day].guided;render();window.scrollTo(0,0);return;}if(b.dataset.preview!==undefined){preview=Number(b.dataset.preview);render();window.scrollTo(0,0);return;}switch(b.dataset.action){case 'exit-workout':workoutActive=false;render();break;case 'complete-current':{const e=entry(b.closest('[data-card]')?.dataset.card,b.closest('[data-card]')?.querySelector('[data-id]')?.dataset.id);e.done=true;persist();render();break;}case 'back':preview=null;render();window.scrollTo(0,0);break;case 'use-weight':{const e=entry(b.dataset.key,b.dataset.id),p=dynamicPlan(b.dataset.id);if(p){e.load=p.suggested;persist();render();toast(`Suggested ${p.suggested} loaded into the log.`);}break;}case 'guide-prev':moveGuide(-1);break;case 'guide-next':moveGuide(1);break;case 'wave-next':{const x=experiment(b.dataset.id);if(!qualifies(b.dataset.id,b.dataset.key)){toast('Complete the prescribed reps and log an eligible RPE first.');break;}x.stage=(x.stage+1)%4;persist();render();toast(x.stage===0?'Experiment complete. Returned to exposure 1.':`Exposure ${x.stage+1} ready.`);break;}case 'reset':confirmAction('Reset checks?','Clear completion checks for this session, including extra mobility. All loads, reps and notes stay saved.',()=>{Object.values(state.current.entries).forEach(e=>e.done=false);state.current.guide={block:0,round:0,step:0};persist();render();toast('Checks and guided position reset. Your entries are intact.');});break;case 'next':{const s=state.current;confirmAction('Advance the protocol?',`Archive Day ${s.day+1}: ${PROGRAM.days[s.day].name} and start ${s.day===9?'a new cycle':'Day '+(s.day+2)}. Unchecked work is preserved as unfinished.`,()=>{state.history.push({...state.current,ended:new Date().toISOString()});state.current=fresh((s.day+1)%10,s.cycle+(s.day===9?1:0));state.current.guide={block:0,round:0,step:0};workoutActive=!!PROGRAM.days[state.current.day].guided;persist();render();window.scrollTo(0,0);toast('Session archived. Next day ready.');});break;}case 'export':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forge-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exported.');break;}case 'import':$('#import-file').click();break;}});
$('#import-file').addEventListener('change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;try{const imported=JSON.parse(await f.text());if(!valid(imported))throw Error();confirmAction('Replace with backup?',`Restore ${imported.history.length} archived sessions and its active day. This replaces current FORGE data. Export first if you want to keep it.`,()=>{state=imported;state.current.guide=state.current.guide&&typeof state.current.guide==='object'?state.current.guide:{block:0,round:0,step:0};workoutActive=!!PROGRAM.days[state.current.day].guided;storageError='';persist();render();toast('Backup restored.');});}catch{toast('Invalid backup. Current data was not changed.');}});
// A generated PNG home-screen icon keeps this deliverable truly self-contained.
try{const c=document.createElement('canvas');c.width=c.height=180;const ctx=c.getContext('2d');ctx.fillStyle='#14283e';ctx.fillRect(0,0,180,180);ctx.strokeStyle='#91dec9';ctx.lineWidth=4;ctx.strokeRect(18,18,144,144);ctx.fillStyle='#91dec9';ctx.font='bold 116px sans-serif';ctx.textAlign='center';ctx.fillText('F',90,132);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.append(l);const icon=document.createElement('link');icon.rel='icon';icon.href=l.href;document.head.append(icon);}catch{}
render();if(storageError)$('#save-status').textContent='Storage needs attention';
</script></body></html>
